{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實境解謎裝置</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="navbar">
        <a href="{% url 'home' %}" style="color:var(--neon-yellow); text-decoration:none;">
            <h2>實境解謎裝置 IoT Escape</h2>
        </a>
        <div>
            {% if user.is_authenticated %}
                <span style="margin-right: 15px; color: var(--neon-pink);">Welcome, {{ user.username }}</span>
                <button onclick="togglePiLed()" id="pi-led-btn" class="pixel-btn" style="border-color: #00ff00; color: #00ff00; margin-right: 15px; cursor: pointer;">💡 樹莓派 LED</button>
                <a href="{% url 'dashboard' %}" class="pixel-btn">Dashboard</a>
                <a href="{% url 'logout' %}" class="pixel-btn pink">登出</a>
            {% else %}
                <a href="{% url 'home' %}" class="pixel-btn">登入 / 註冊</a>
            {% endif %}
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ledState = localStorage.getItem('pi_led_state') === '1';
        updateLedBtnUI(ledState);
    });

    function updateLedBtnUI(isOn) {
        const btn = document.getElementById('pi-led-btn');
        if (!btn) return;
        // 注意：因為硬體是反相 (0=亮, 1=暗)，所以當 isOn 為 false (0) 時，代表燈亮著
        if (!isOn) {
            btn.style.backgroundColor = '#00ff00';
            btn.style.color = '#000000';
            btn.innerText = '💡 LED (開)';
        } else {
            btn.style.backgroundColor = 'transparent';
            btn.style.color = '#00ff00';
            btn.innerText = '💡 LED (關)';
        }
    }

    function togglePiLed() {
        fetch('/api/toggle-pi-led/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        }).then(res => res.json()).then(data => {
            if(data.status === 'success') {
                const currentState = localStorage.getItem('pi_led_state') === '1';
                const newState = !currentState;
                localStorage.setItem('pi_led_state', newState ? '1' : '0');
                updateLedBtnUI(newState);
                console.log('LED toggle command sent via MQTT');
            } else {
                console.error('Error:', data.message);
            }
        }).catch(err => console.error(err));
    }
    </script>

    
    <div class="heart-container">
        <div class="pixel-heart blue"></div>
        <div class="pixel-heart pink"></div>
        <div class="pixel-heart yellow"></div>
        <div style="font-size: 20px; line-height: 40px; margin: 0 20px; letter-spacing: 4px; color: var(--primary-blue);">...</div>
        <div class="pixel-heart blue"></div>
        <div class="pixel-heart pink"></div>
        <div class="pixel-heart yellow"></div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
