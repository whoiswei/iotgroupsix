{% extends 'mainapp/base.html' %}
{% block content %}
<div style="text-align: center;">
    <h1 style="color: var(--neon-pink);">{{ project.title }}</h1>
    
    <div class="pixel-border" style="border-color: var(--neon-blue); max-width: 600px; margin: 0 auto; text-align: left; background: #0c0c20; box-sizing: border-box; overflow: hidden; padding: 25px;">
        
        <!-- ==================== 1. 遊戲面板 ==================== -->
        <div id="game-panel">
            <h2 style="color: var(--neon-blue); text-align: center; margin-top: 0;">遊戲狀態 STATUS</h2>
            
            <div style="display: flex; justify-content: space-around; margin: 20px 0; background: #050515; padding: 15px 0; border: 1px dashed var(--primary-blue);">
                <div style="text-align: center;">
                    <p style="color: var(--neon-yellow); margin-bottom: 5px; font-size: 0.9rem;">總時間 TOTAL TIME</p>
                    <div style="font-size: 2rem; color: var(--neon-yellow); font-family: monospace;" id="global-timer">-- : --</div>
                </div>
                <div style="text-align: center; border-left: 1px solid #333; border-right: 1px solid #333; padding: 0 20px;">
                    <p style="color: var(--primary-blue); margin-bottom: 5px; font-size: 0.9rem;">關卡時間 LEVEL TIME</p>
                    <div style="font-size: 2rem; color: var(--primary-blue); font-family: monospace;" id="timer">-- : --</div>
                </div>
                <div style="text-align: center;">
                    <p style="color: var(--neon-pink); margin-bottom: 5px; font-size: 0.9rem;">錯誤次數 ERRORS</p>
                    <div style="font-size: 2rem; color: var(--neon-pink); font-family: monospace;">
                        <span id="errors">0</span> / <span id="max-errors">{{ project.max_errors }}</span>
                    </div>
                </div>
            </div>

            <hr style="border: 1px dashed var(--primary-blue); margin: 25px 0;">

            <h2 style="color: var(--neon-blue); text-align: center; margin-top: 0;">故事劇情 STORY</h2>
            
            <p id="story-text" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 15px;">{{ project.story_intro }}</p>
            
            <!-- 顯示圖片的區域 -->
            <div id="image-display-section" style="text-align: center; margin-top: 15px;">
                <!-- 專案背景圖 -->
                <div id="project-image-container" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px;">
                    <!-- Images injected by JS -->
                </div>
                
                <!-- 關卡引導圖片 -->
                <div id="module-image-container" style="display: none; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 10px; background: #050510; border: 1px solid #202050;">
                    <!-- Images injected by JS -->
                </div>
            </div>
            
            <hr style="border: 1px dashed var(--primary-blue); margin: 25px 0;">
            
            <div style="text-align: center; margin-top: 20px;">
                <button id="start-btn" class="pixel-btn" style="border-color: var(--neon-yellow); color: var(--neon-yellow); margin: 0;">開始連線 START</button>
                <button id="end-btn" class="pixel-btn pink" style="display: none; margin: 0;">強制結束 END</button>
            </div>
        </div>

        <!-- ==================== 2. 結算面板 ==================== -->
        <div id="results-panel" style="display: none; text-align: center;">
            <h2 id="result-title" style="font-size: 2.3rem; text-shadow: 0 0 10px var(--neon-blue); margin-top: 0;">任務成功 SUCCESS</h2>
            
            <div style="background: #050515; padding: 20px; border: 1px dashed var(--primary-blue); margin: 20px 0; border-radius: 8px;">
                <p id="result-text" style="font-size: 1.25rem; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; text-align: left;"></p>
                
                <div id="result-image-container" style="margin-top: 15px; display: flex; justify-content: center;">
                    <!-- Result image injected by JS -->
                </div>
            </div>
            
            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <button onclick="location.reload();" class="pixel-btn" style="border-color: var(--neon-yellow); color: var(--neon-yellow); margin: 0;">再玩一次 PLAY AGAIN</button>
                <a href="{% url 'player_list' %}" class="pixel-btn pink" style="margin: 0; text-decoration: none; display: inline-block; padding: 10px 20px; line-height: 1.2;">選擇其他專案 BACK</a>
            </div>
        </div>

    </div>
</div>

<script>
    const projectConfig = {{ play_modules_json|default:'[]'|safe }};
    const maxErrorsAllowed = {{ project.max_errors|default:3 }};
    const projectImageUrls = {{ project_image_urls_json|default:'[]'|safe }};
    const globalTimeLimit = {{ project.time_limit|default:3600 }};

    const successText = "{{ project.success_text|default:''|escapejs }}";
    const successImageUrl = "{% if project.success_image %}{{ project.success_image.url }}{% endif %}";
    const failureText = "{{ project.failure_text|default:''|escapejs }}";
    const failureImageUrl = "{% if project.failure_image %}{{ project.failure_image.url }}{% endif %}";

    const startBtn = document.getElementById('start-btn');
    const endBtn = document.getElementById('end-btn');
    const timerDisplay = document.getElementById('timer');
    const globalTimerDisplay = document.getElementById('global-timer');
    const errorsDisplay = document.getElementById('errors');
    const storyTextDisplay = document.getElementById('story-text');
    const projectImageContainer = document.getElementById('project-image-container');
    const moduleImageContainer = document.getElementById('module-image-container');

    let currentModuleIndex = 0;
    let timerInterval = null;
    let globalTimerInterval = null;
    let timeRemaining = 0;
    let globalTimeRemaining = 0;
    let errors = 0;
    let gameActive = false;
    
    // Render initial project images
    if (projectImageUrls.length > 0) {
        projectImageUrls.forEach(url => {
            projectImageContainer.innerHTML += `<img src="${url}" style="max-width: 100%; max-height: 220px; border: 2px solid var(--primary-blue); border-radius: 4px;">`;
        });
    } else {
        projectImageContainer.style.display = 'none';
    }

    startBtn.addEventListener('click', () => {
        if (projectConfig.length === 0) {
            storyTextDisplay.textContent = "此專案沒有任何解謎關卡！";
            return;
        }

        console.log("Publishing project config to MQTT topic 'iot_escape/project/start'...");
        console.log(JSON.stringify(projectConfig));
        
        gameActive = true;
        errors = 0;
        errorsDisplay.textContent = "0";
        
        startBtn.style.display = 'none';
        endBtn.style.display = 'inline-block';
        if (projectImageUrls.length > 0 && projectImageContainer) {
            projectImageContainer.style.display = 'none'; // 開始後隱藏專案大圖，留空間給關卡圖
        }
        
        globalTimeRemaining = globalTimeLimit;
        clearInterval(globalTimerInterval);
        updateGlobalTimerDisplay();
        
        globalTimerInterval = setInterval(() => {
            globalTimeRemaining--;
            updateGlobalTimerDisplay();
            if (globalTimeRemaining <= 0) {
                clearInterval(globalTimerInterval);
                clearInterval(timerInterval);
                showResults(false, "⏳ 總時間到！挑戰超限，任務失敗！");
            }
        }, 1000);
        
        loadModule(0);
    });

    endBtn.addEventListener('click', () => {
        showResults(false, "遊戲已被強制結束。");
    });

    function showResults(isWin, fallbackReason) {
        gameActive = false;
        clearInterval(timerInterval);
        clearInterval(globalTimerInterval);
        
        // Hide game panel, show results panel
        document.getElementById('game-panel').style.display = 'none';
        const resultsPanel = document.getElementById('results-panel');
        resultsPanel.style.display = 'block';
        
        const resultTitle = document.getElementById('result-title');
        const resultText = document.getElementById('result-text');
        const resultImgContainer = document.getElementById('result-image-container');
        
        resultImgContainer.innerHTML = '';
        
        if (isWin) {
            resultTitle.textContent = "任務成功 SUCCESS";
            resultTitle.style.color = "var(--neon-blue)";
            resultTitle.style.textShadow = "0 0 15px var(--neon-blue)";
            
            resultText.textContent = successText ? successText : (fallbackReason || "恭喜通關所有模組！遊戲成功結束。");
            if (successImageUrl) {
                resultImgContainer.innerHTML = `<img src="${successImageUrl}" style="max-width: 100%; max-height: 250px; border: 2px solid var(--neon-blue); border-radius: 4px; box-shadow: 0 0 15px var(--neon-blue);">`;
            }
        } else {
            resultTitle.textContent = "任務失敗 FAILED";
            resultTitle.style.color = "var(--neon-pink)";
            resultTitle.style.textShadow = "0 0 15px var(--neon-pink)";
            
            resultText.textContent = failureText ? failureText : (fallbackReason || "任務失敗！炸彈已引爆！");
            if (failureImageUrl) {
                resultImgContainer.innerHTML = `<img src="${failureImageUrl}" style="max-width: 100%; max-height: 250px; border: 2px solid var(--neon-pink); border-radius: 4px; box-shadow: 0 0 15px var(--neon-pink);">`;
            }
        }
    }

    function loadModule(index) {
        if (index >= projectConfig.length) {
            showResults(true, "🎉 恭喜通關所有模組！遊戲結束。");
            return;
        }

        currentModuleIndex = index;
        const mod = projectConfig[index];
        storyTextDisplay.innerHTML = `<span style="color:var(--neon-pink); font-weight:bold;">[關卡 ${index + 1} - ${getModuleName(mod.module_type)}]</span><br>${mod.story}`;
        
        // 載入關卡圖片
        moduleImageContainer.innerHTML = '';
        if (mod.image_urls && mod.image_urls.length > 0) {
            mod.image_urls.forEach(url => {
                moduleImageContainer.innerHTML += `<img src="${url}" style="max-width: 100%; max-height: 200px; border: 2px solid var(--neon-pink); border-radius: 4px;">`;
            });
            moduleImageContainer.style.display = 'flex';
        } else {
            moduleImageContainer.style.display = 'none';
        }

        timeRemaining = mod.time_limit;
        clearInterval(timerInterval);
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                showResults(false, "⏳ 時間到！關卡剩餘時間歸零，任務失敗！");
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const secs = (timeRemaining % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${mins} : ${secs}`;
    }

    function updateGlobalTimerDisplay() {
        const mins = Math.floor(globalTimeRemaining / 60).toString().padStart(2, '0');
        const secs = (globalTimeRemaining % 60).toString().padStart(2, '0');
        globalTimerDisplay.textContent = `${mins} : ${secs}`;
    }

    function getModuleName(type) {
        const names = {
            1: '方向指令模組',
            2: '鑰匙模組',
            3: '調頻模組',
            4: 'RGB模組',
            5: '摩斯密碼模組',
            6: '旋鈕模組',
            7: '密碼模組',
            8: '拆線模組',
            9: '符號指撥開關模組'
        };
        return names[type] || '未知模組';
    }

    // Mock receiving MQTT messages from hardware
    function mockReceiveMqttMessage(topic, payload) {
        if (!gameActive) return;

        if (topic === 'iot_escape/status/error') {
            errors++;
            errorsDisplay.textContent = errors;
            
            if (errors >= maxErrorsAllowed) {
                clearInterval(timerInterval);
                clearInterval(globalTimerInterval);
                showResults(false, `💥 錯誤達上限 (${maxErrorsAllowed}次)！任務失敗。`);
            } else {
                storyTextDisplay.innerHTML += `<br><span style="color:var(--neon-pink)">⚠️ 錯誤觸發！目前累計 ${errors} 次錯誤。</span>`;
            }
        } else if (topic === 'iot_escape/status/module_passed') {
            loadModule(currentModuleIndex + 1);
        }
    }

    // Expose mock functions for manual testing in browser console
    window.triggerError = () => mockReceiveMqttMessage('iot_escape/status/error', {});
    window.triggerPass = () => mockReceiveMqttMessage('iot_escape/status/module_passed', {});

    // Initialize global timer display with project's time limit before start
    function initGlobalTimer() {
        const mins = Math.floor(globalTimeLimit / 60).toString().padStart(2, '0');
        const secs = (globalTimeLimit % 60).toString().padStart(2, '0');
        globalTimerDisplay.textContent = `${mins} : ${secs}`;
    }
    initGlobalTimer();
</script>
{% endblock %}
